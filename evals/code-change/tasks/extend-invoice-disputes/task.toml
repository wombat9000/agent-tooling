schema_version = "1.4"
artifacts = ["/workspace/src"]

[task]
name = "agent-tooling/code-change-extend-invoice-disputes"
description = "Extend an existing Kotlin Spring Boot invoice billing API backed by H2 and JDBC with an invoice dispute workflow."
keywords = ["code-change", "brownfield", "extend", "kotlin", "spring-boot", "jdbc"]

[environment]
skills_dir = "/skills"
workdir = "/workspace"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 300
